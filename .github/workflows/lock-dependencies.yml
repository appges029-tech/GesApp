name: Lock Flutter dependencies

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Flutter 3.47.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Generate lockfile
        run: flutter pub get

      - name: Commit pubspec.lock
        shell: bash
        run: |
          set -euo pipefail
          test -f pubspec.lock
          git add pubspec.lock
          if git diff --cached --quiet; then
            echo "pubspec.lock is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(deps): lock Flutter dependencies"
          git push origin HEAD:main
