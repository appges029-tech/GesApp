name: GesApp Web CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gesapp-web-${{ github.ref }}
  cancel-in-progress: true

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL || 'https://layuzuqhmidwvcydvvre.supabase.co' }}
  SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY || vars.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_tR2MiYBocXc4eTaWTWRgXg_8DAPt-It' }}
  SUPABASE_REDIRECT_URL: ${{ secrets.SUPABASE_REDIRECT_URL || vars.SUPABASE_REDIRECT_URL || 'com.godfirst.gesapp://login-callback/' }}
  WEB_BASE_HREF: ${{ vars.WEB_BASE_HREF || '/GesApp_2.2.2_AUDIT100_FIXED/' }}

jobs:
  build-web:
    name: Analyze, Test & Build Web
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Flutter 3.47.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Enable Flutter Web
        run: flutter config --enable-web

      - name: Ensure Web scaffold exists
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f web/index.html ]; then
            flutter create --platforms=web .
          fi

      - name: Resolve dependencies
        run: flutter pub get

      - name: Install SQLite Web runtime
        shell: bash
        run: |
          set -euo pipefail
          # Le setup sqflite peut échouer lorsqu'il compile son worker dans le
          # contexte d'un gros projet Flutter avec build hooks. Le mainteneur
          # recommande alors de générer les binaires dans un projet Dart
          # isolé puis de les copier dans web/.
          TMP_DIR="$(mktemp -d)"
          dart create -t web "$TMP_DIR/sqflite_setup" --force
          cd "$TMP_DIR/sqflite_setup"
          dart pub add sqflite_common_ffi_web:1.2.0
          dart pub global activate webdev
          export PATH="$PATH:$HOME/.pub-cache/bin"
          dart run sqflite_common_ffi_web:setup --force
          test -s web/sqlite3.wasm
          test -s web/sqflite_sw.js
          cp web/sqlite3.wasm "$GITHUB_WORKSPACE/web/sqlite3.wasm"
          cp web/sqflite_sw.js "$GITHUB_WORKSPACE/web/sqflite_sw.js"
          cd "$GITHUB_WORKSPACE"
          rm -rf "$TMP_DIR"

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Verify Supabase configuration for production deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "SUPABASE_URL et SUPABASE_PUBLISHABLE_KEY (ou SUPABASE_ANON_KEY) sont requis pour déployer le Web de production."
            exit 1
          fi
          flutter test test/supabase_config_test.dart \
            --dart-define=SUPABASE_CONFIG_EXPECTED=true \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=SUPABASE_REDIRECT_URL="$SUPABASE_REDIRECT_URL"

      - name: Build Web release
        shell: bash
        run: |
          flutter build web --release \
            --base-href="$WEB_BASE_HREF" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=SUPABASE_REDIRECT_URL="$SUPABASE_REDIRECT_URL"

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: GesApp-Web
          path: build/web
          if-no-files-found: error
          retention-days: 14

      - name: Deploy GitHub Pages branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          force_orphan: true
