name: GesApp Web CI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-web.yml'
      - 'lib/features/security/super_admin_*.dart'
      - 'lib/services/super_admin_service.dart'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-web.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gesapp-web-${{ github.ref }}
  cancel-in-progress: true

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL || 'https://layuzuqhmidwvcydvvre.supabase.co' }}
  SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY || vars.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_tR2MiYBocXc4eTaWTWRgXg_8DAPt-It' }}
  SUPABASE_REDIRECT_URL: ${{ secrets.SUPABASE_REDIRECT_URL || vars.SUPABASE_REDIRECT_URL || 'com.godfirst.gesapp://login-callback/' }}
  WEB_BASE_HREF: ${{ vars.WEB_BASE_HREF || '/GesApp_2.2.2_AUDIT100_FIXED/' }}

jobs:
  build-web:
    name: Analyze, Test & Build Web
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Flutter 3.47.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Enable Flutter Web
        run: flutter config --enable-web

      - name: Ensure Web scaffold exists
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f web/index.html ]; then
            flutter create --platforms=web .
          fi

      - name: Resolve dependencies
        run: flutter pub get

      - name: Install SQLite Web runtime
        run: dart run sqflite_common_ffi_web:setup --force

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Verify Supabase configuration for production deploy
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "SUPABASE_URL et SUPABASE_PUBLISHABLE_KEY (ou SUPABASE_ANON_KEY) sont requis pour déployer le Web de production."
            exit 1
          fi
          flutter test test/supabase_config_test.dart \
            --dart-define=SUPABASE_CONFIG_EXPECTED=true \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=SUPABASE_REDIRECT_URL="$SUPABASE_REDIRECT_URL"

      - name: Build Web release
        shell: bash
        run: |
          flutter build web --release \
            --base-href="$WEB_BASE_HREF" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=SUPABASE_REDIRECT_URL="$SUPABASE_REDIRECT_URL"

      - name: Upload Web artifact (manual build only)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: GesApp-Web
          path: build/web
          if-no-files-found: error
          retention-days: 14

      - name: Deploy GitHub Pages branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          force_orphan: true
