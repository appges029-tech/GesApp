name: GesApp Android Debug CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gesapp-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-debug:
    name: Analyze, Test & Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_REDIRECT_URL: ${{ secrets.SUPABASE_REDIRECT_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Replace invalid Gradle Wrapper with official 8.14.3
        shell: bash
        run: |
          set -e

          WRAPPER="android/gradle/wrapper/gradle-wrapper.jar"

          rm -f "$WRAPPER"

          curl -L \
            https://services.gradle.org/distributions/gradle-8.14.3-wrapper.jar \
            -o "$WRAPPER"

          echo "Checking Gradle Wrapper SHA-256..."

          ACTUAL_SHA=$(sha256sum "$WRAPPER" | awk '{print $1}')
          EXPECTED_SHA="7d3a4ac4de1c32b59bc6a4eb8ecb8e612ccd0cf1ae1e99f66902da64df296172"

          echo "Expected: $EXPECTED_SHA"
          echo "Actual:   $ACTUAL_SHA"

          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "❌ Invalid Gradle Wrapper checksum"
            exit 1
          fi

          echo "✅ Official Gradle 8.14.3 Wrapper installed"

      - name: Set up Flutter 3.47.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Show environment
        run: |
          java -version
          flutter --version
          cd android
          ./gradlew --version

      - name: Validate Supabase configuration
        shell: bash
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "❌ SUPABASE_URL manquant"
            exit 1
          fi

          if [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "❌ SUPABASE_PUBLISHABLE_KEY manquant"
            exit 1
          fi

          echo "✅ Supabase configuration OK"

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Flutter Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Flutter Tests
        run: |
          flutter test \
            --dart-define=SUPABASE_CONFIG_EXPECTED=true \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=SUPABASE_REDIRECT_URL="$SUPABASE_REDIRECT_URL"

      - name: Build Android Debug APK
        run: |
          flutter build apk --debug \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=SUPABASE_REDIRECT_URL="$SUPABASE_REDIRECT_URL"

      - name: Verify APK
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "❌ APK not found"
            exit 1
          fi

          echo "✅ APK generated"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GesApp-Android-Debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
