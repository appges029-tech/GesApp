name: GesApp Android Debug CI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build_android.yml'
      - 'lib/features/security/super_admin_*.dart'
      - 'lib/services/super_admin_service.dart'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gesapp-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-debug:
    name: Analyze, Test & Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL || 'https://layuzuqhmidwvcydvvre.supabase.co' }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_tR2MiYBocXc4eTaWTWRgXg_8DAPt-It' }}
      SUPABASE_REDIRECT_URL: ${{ secrets.SUPABASE_REDIRECT_URL || vars.SUPABASE_REDIRECT_URL || 'com.godfirst.gesapp://login-callback/' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Reclaim disk space for Android build
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk capacity before cleanup:"
          df -h /

          # Android compilation does not use these preinstalled toolchains.
          # Keep the Android SDK build-tools, platforms, NDK and CMake intact.
          for unused in \
            /usr/share/dotnet \
            /usr/local/swift \
            /usr/local/share/powershell \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android/sdk/system-images \
            /usr/local/lib/android/sdk/emulator; do
            if [ -d "$unused" ]; then
              echo "Removing unused runner component: $unused"
              sudo rm -rf -- "$unused"
            fi
          done

          echo "Disk capacity after cleanup:"
          df -h /

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore official Gradle 8.14.3 wrapper
        shell: bash
        run: |
          set -euo pipefail
          WRAPPER="android/gradle/wrapper/gradle-wrapper.jar"
          mkdir -p "$(dirname "$WRAPPER")"
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/gradle/gradle/v8.14.3/gradle/wrapper/gradle-wrapper.jar \
            --output "$WRAPPER"
          test "$(wc -c < "$WRAPPER")" -gt 30000
          jar tf "$WRAPPER" | grep -q 'org/gradle/wrapper/GradleWrapperMain.class'
          chmod +x android/gradlew

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Flutter 3.47.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Show environment
        run: |
          java -version
          flutter --version
          cd android
          ./gradlew --version

      - name: Validate Supabase configuration
        shell: bash
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "❌ SUPABASE_URL manquant"
            exit 1
          fi

          if [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "❌ SUPABASE_PUBLISHABLE_KEY manquant"
            exit 1
          fi

          echo "✅ Supabase configuration OK"

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Flutter Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Flutter Tests
        run: |
          flutter test \
            --dart-define=SUPABASE_CONFIG_EXPECTED=true \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=SUPABASE_REDIRECT_URL="$SUPABASE_REDIRECT_URL"

      - name: Check disk capacity before APK build
        shell: bash
        run: |
          df -h .
          available_kib=$(df -Pk . | awk 'NR == 2 {print $4}')
          if (( available_kib < 4 * 1024 * 1024 )); then
            echo "::warning::Less than 4 GiB free before Android packaging"
          fi

      - name: Build Android Debug APK
        run: |
          flutter build apk --debug \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=SUPABASE_REDIRECT_URL="$SUPABASE_REDIRECT_URL"

      - name: Verify APK
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "❌ APK not found"
            exit 1
          fi

          echo "✅ APK generated"
          ls -lh "$APK"

      - name: Upload APK
        continue-on-error: true # Un quota d'artefacts plein ne rend pas l'APK compilé invalide.
        uses: actions/upload-artifact@v4
        with:
          name: GesApp-Android-Debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
