name: gesapp
description: Application de gestion scolaire offline-first pour les établissements congolais.
publish_to: 'none'
version: 2.2.3+44
environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  sqflite: ^2.4.1
  sqflite_common: ^2.5.11
  sqflite_common_ffi: ^2.4.2+1
  sqflite_common_ffi_web: ^1.1.2
  path: ^1.9.1
  path_provider: ^2.1.5
  intl: ^0.20.1
  uuid: ^4.5.1
  pdf: ^3.11.1
  printing: ^5.13.4
  file_picker: ^9.2.3
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  supabase_flutter: ^2.15.4
  crypto: ^3.0.6
  cryptography: ^2.7.0
  flutter_local_notifications: ^22.3.0
  workmanager: ^0.9.0+2
  excel: ^4.0.6
  csv: ^6.0.0
  liquid_glass_widgets: ^1.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
